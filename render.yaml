# Render Blueprint: one click creates the API (web service) and the React app (static site).
# Set the secret values (MONGO_URI from MongoDB Atlas, JWT_SECRET, Cloudinary keys) in the Render dashboard.
services:
  - type: web
    name: quickform-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: quickform-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: send every path (e.g. /f/abc123) to index.html
      - type: rewrite
        source: /*
        destination: /index.html
